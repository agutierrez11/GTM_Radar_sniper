<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTM INTEL — Dossier Forense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07070f;
      --surface:   #0e0e1a;
      --border:    #1e1e32;
      --accent:    #00e5a0;
      --accent2:   #00b4d8;
      --dim:       #3a3a5c;
      --text:      #c8c8e0;
      --text-muted:#6060a0;
      --danger:    #ff4466;
      --warn:      #ffaa00;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

    /* ── TOP BAR ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 52px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { font-family: 'JetBrains Mono', monospace; font-size: .75rem; font-weight: 700; letter-spacing: .2em; color: var(--accent); }
    .topbar-sub   { font-family: 'JetBrains Mono', monospace; font-size: .65rem; color: var(--text-muted); letter-spacing: .1em; }
    .topbar-dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:.3 } }

    /* ── LAYOUT ── */
    .main { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    /* ── FORM CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem;
      box-shadow: 0 0 40px rgba(0,229,160,.04);
    }
    .card-title { font-size: .65rem; font-family: 'JetBrains Mono', monospace; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; margin-bottom: 1.5rem; }

    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field-full { grid-column: 1 / -1; }

    label { display: block; font-size: .7rem; font-family: 'JetBrains Mono', monospace; letter-spacing: .12em; color: var(--text-muted); margin-bottom: .4rem; text-transform: uppercase; }

    input, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; padding: .65rem .9rem; color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: .8rem;
      transition: border-color .2s, box-shadow .2s; outline: none; resize: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,.1);
    }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    input.url-loading {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(0,180,216,.1);
      padding-right: 2.5rem;
    }
    input.url-error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(255,68,102,.1);
    }
    .input-wrapper { position: relative; display: flex; align-items: stretch; }
    .url-loader {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; border: 2px solid rgba(0,229,160,.3);
      border-top-color: var(--accent2); border-radius: 50%;
      animation: spin .6s linear infinite; display: none;
    }
    .url-loader.show { display: block; }

    .btn {
      margin-top: 1.5rem; width: 100%;
      background: var(--accent); color: #07070f;
      border: none; border-radius: 8px; padding: .8rem 1rem;
      font-family: 'JetBrains Mono', monospace; font-size: .8rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 0 20px rgba(0,229,160,.25);
    }
    .btn:hover  { opacity: .88; box-shadow: 0 0 32px rgba(0,229,160,.45); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── LOADING ── */
    #loading { display: none; margin-top: 2.5rem; }
    .loading-inner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem 2rem 1.8rem;
    }
    .loading-header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--accent); letter-spacing: .15em; text-transform: uppercase; }

    .loading-msg {
      font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--text);
      min-height: 1.4em; transition: opacity .35s;
    }
    .loading-msg.fade { opacity: 0; }

    .loading-bar-wrap { margin-top: 1.5rem; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .loading-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; animation: barFlow 3s ease-in-out infinite; }
    @keyframes barFlow { 0%{ width:0%;margin-left:0 } 50%{ width:60%;margin-left:20% } 100%{ width:0%;margin-left:100% } }

    /* ── RESULT ── */
    #result { display: none; margin-top: 2.5rem; }
    .result-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .result-label { font-family: 'JetBrains Mono', monospace; font-size: .65rem; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
    .copy-btn {
      background: var(--border); border: 1px solid var(--dim); color: var(--text-muted);
      border-radius: 6px; padding: .3rem .7rem;
      font-family: 'JetBrains Mono', monospace; font-size: .65rem; letter-spacing: .1em;
      cursor: pointer; transition: background .2s, color .2s;
    }
    .copy-btn:hover { background: var(--dim); color: var(--text); }

    .result-body {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem 2.2rem;
      box-shadow: 0 0 40px rgba(0,180,216,.04);
    }

    /* ── MARKDOWN STYLES ── */
    .md h1,.md h2,.md h3,.md h4 {
      font-family: 'Inter', sans-serif; color: #fff; margin: 1.8rem 0 .7rem;
      font-weight: 600; line-height: 1.3;
    }
    .md h1 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem; }
    .md h2 { font-size: 1.1rem; color: var(--accent); }
    .md h3 { font-size: .95rem; color: var(--accent2); }
    .md h4 { font-size: .88rem; color: var(--text); }
    .md p  { line-height: 1.75; margin: .7rem 0; font-size: .9rem; }
    .md ul,.md ol { padding-left: 1.4rem; margin: .6rem 0; }
    .md li { margin: .35rem 0; line-height: 1.65; font-size: .88rem; }
    .md strong { color: #fff; font-weight: 600; }
    .md em { color: var(--accent2); }
    .md code {
      background: rgba(0,229,160,.07); color: var(--accent);
      border-radius: 4px; padding: .1em .4em;
      font-family: 'JetBrains Mono', monospace; font-size: .82em;
    }
    .md pre {
      background: rgba(0,0,0,.4); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem 1.2rem; overflow-x: auto; margin: 1rem 0;
    }
    .md pre code { background: none; padding: 0; font-size: .82rem; color: var(--text); }
    .md blockquote {
      border-left: 3px solid var(--accent); padding: .5rem 1rem; margin: 1rem 0;
      background: rgba(0,229,160,.04); border-radius: 0 6px 6px 0;
      font-style: italic; color: #a0a0c8;
    }
    .md table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .85rem; }
    .md th { background: rgba(0,229,160,.08); color: var(--accent); padding: .55rem .9rem; text-align: left; border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: .75rem; letter-spacing: .08em; }
    .md td { padding: .5rem .9rem; border: 1px solid var(--border); color: var(--text); vertical-align: top; }
    .md tr:nth-child(even) td { background: rgba(255,255,255,.02); }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .md a { color: var(--accent2); text-decoration: none; }
    .md a:hover { text-decoration: underline; }

    /* ── WEB CONTEXT BOX ── */
    #web-context-box { display: none; margin-top: 2.5rem; }
    .wc-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px 10px 0 0; padding: .65rem 1.1rem;
      cursor: pointer; user-select: none;
    }
    .wc-header:hover { border-color: var(--dim); }
    .wc-label { font-family: 'JetBrains Mono', monospace; font-size: .65rem; letter-spacing: .18em; color: var(--accent2); text-transform: uppercase; }
    .wc-count { font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--text-muted); }
    .wc-chevron { font-size: .7rem; color: var(--text-muted); transition: transform .25s; }
    .wc-chevron.open { transform: rotate(180deg); }
    .wc-body {
      background: rgba(0,180,216,.03); border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 10px 10px; padding: 1rem 1.2rem;
      max-height: 380px; overflow-y: auto; display: none;
    }
    .wc-body.open { display: block; }
    .wc-snippet { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--text); line-height: 1.65; padding: .4rem 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .wc-snippet:last-child { border-bottom: none; }
    .wc-snippet a { color: var(--accent2); text-decoration: none; word-break: break-all; }
    .wc-snippet a:hover { text-decoration: underline; }
    .wc-snippet .wc-body-text { color: var(--text-muted); display: block; margin-top: .2rem; }

    /* ── ERROR ── */
    #error { display: none; margin-top: 2rem; padding: 1rem 1.5rem;
      background: rgba(255,68,102,.06); border: 1px solid rgba(255,68,102,.25);
      border-radius: 8px; color: var(--danger);
      font-family: 'JetBrains Mono', monospace; font-size: .8rem; }

    /* ── FOOTER ── */
    .footer { text-align: center; margin-top: 3rem; font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--text-muted); letter-spacing: .15em; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<nav class="topbar">
  <div style="display:flex;align-items:center;gap:.75rem">
    <div class="topbar-dot"></div>
    <span class="topbar-brand">GTM INTEL</span>
  </div>
  <span class="topbar-sub">DOSSIER FORENSE · GTM INTELLIGENCE</span>
  <span class="topbar-sub" id="clock"></span>
</nav>

<main class="main">

  <!-- FORM -->
  <div class="card">
    <div class="card-title">// configurar análisis</div>
    <div class="fields">
      <div>
        <label for="empresa_vende">¿Quién vende?</label>
        <div class="input-wrapper">
          <input type="text" id="empresa_vende" placeholder="ej: Fiserv o https://fiserv.com" />
          <div class="url-loader" id="loader-vende"></div>
        </div>
      </div>
      <div>
        <label for="empresa_compra">¿A quién le vende?</label>
        <div class="input-wrapper">
          <input type="text" id="empresa_compra" placeholder="ej: Deuna o https://deuna.io" />
          <div class="url-loader" id="loader-compra"></div>
        </div>
      </div>
      <div class="field-full">
        <label for="concepto_venta">¿Qué quiere vender?</label>
        <input type="text" id="concepto_venta" placeholder="ej: procesamiento de pagos y plataforma core de adquirencia" />
      </div>
    </div>

    <button class="btn" id="analyze-btn" onclick="runAnalysis()">⚡ Generar Dossier Forense</button>
  </div>

  <!-- LOADING -->
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-header">
        <div class="spinner"></div>
        <span class="loading-label">Ejecutando análisis forense</span>
      </div>
      <div class="loading-msg" id="loading-msg">Iniciando motores de inteligencia...</div>
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    </div>
  </div>

  <!-- WEB CONTEXT BOX -->
  <div id="web-context-box">
    <div class="wc-header" onclick="toggleWebContext()">
      <span class="wc-label">🌐 Fuentes encontradas</span>
      <span style="display:flex;align-items:center;gap:.75rem">
        <span class="wc-count" id="wc-count"></span>
        <span class="wc-chevron" id="wc-chevron">▼</span>
      </span>
    </div>
    <div class="wc-body" id="wc-body"></div>
  </div>

  <!-- ERROR -->
  <div id="error"></div>

  <!-- RESULT -->
  <div id="result">
    <div class="result-header">
      <span class="result-label">// dossier forense</span>
      <div style="display:flex;gap:.5rem">
        <button class="copy-btn" onclick="downloadMarkdown()">[ descargar markdown ]</button>
        <button class="copy-btn" onclick="copyResult()">[ copiar markdown ]</button>
      </div>
    </div>
    <div class="result-body">
      <div class="md" id="result-content"></div>
    </div>
  </div>

  <div class="footer">GTM INTELLIGENCE OS · FINTECH LATAM</div>
</main>

<script>
  // ── PROVIDER ──
  // Single provider: OpenRouter via backend DDG web search

  // ── CLOCK ──
  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('es-MX', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── LOADING MESSAGES ──
  // Solo en fase modelo (tras fetch_done). Sin verbos de “ir a buscar datos”: consultar / buscar / cruzar (ni variantes tipo triangulación de fuentes).
  const LOADING_MESSAGES = [
    "Escaneando ecosistema fintech latinoamericano...",
    "Triangulando posición competitiva del target...",
    "Ejecutando análisis forense de la cuenta...",
    "Procesando señales de crecimiento y funding...",
    "Evaluando stack tecnológico del prospecto...",
    "Calculando fricción técnica y dolor financiero...",
    "Verificando rondas de inversión recientes...",
    "Analizando movimientos estratégicos del mercado...",
    "Construyendo dossier de estrategia...",
    "Identificando competidores y socios potenciales...",
    "Formulando apertura de reunión optimizada...",
    "Detectando sesgo y validando hipótesis forense...",
    "Generando Schwerpunkt y flanqueo táctico...",
    "Compilando leads calificados para el equipo comercial...",
    "Redactando veredicto final del dossier...",
    "Analizando perfil de decisores clave...",
    "Mapeando cadena de valor del sector...",
    "Evaluando madurez regulatoria del mercado objetivo...",
    "Detectando expansión geográfica reciente...",
    "Analizando partnerships y alianzas estratégicas...",
    "Verificando historial de integraciones tecnológicas...",
    "Procesando datos de BID Lab y IFC...",
    "Escaneando cobertura de prensa financiera...",
    "Calibrando ICP Score del prospecto...",
    "Analizando modelo de monetización y unit economics...",
    "Detectando cambios recientes en liderazgo ejecutivo...",
    "Validando presencia en ferias y eventos del sector...",
    "Procesando menciones en medios especializados...",
    "Evaluando penetración de mercado actual...",
    "Analizando velocidad de crecimiento de usuarios...",
    "Verificando cumplimiento regulatorio por país...",
    "Mapeando ecosistema de proveedores del target...",
    "Analizando estructura de precios y márgenes...",
    "Detectando señales de stress financiero...",
    "Evaluando potencial de expansión cross-border...",
    "Procesando inteligencia competitiva del sector...",
    "Identificando ventanas de oportunidad táctica...",
    "Verificando integraciones con procesadores actuales...",
    "Analizando dependencias tecnológicas críticas...",
    "Evaluando posicionamiento en el mercado local...",
    "Detectando movimientos de fundraising recientes...",
    "Analizando estrategia de go-to-market del prospecto...",
    "Verificando contratos gubernamentales y licitaciones...",
    "Procesando feedback de clientes en Trustpilot y G2...",
    "Triangulando dolor operativo con oferta comercial...",
    "Generando argumentario de venta personalizado...",
    "Analizando timing óptimo para el acercamiento...",
    "Evaluando riesgo de objeción en primera reunión...",
    "Calibrando nivel de urgencia del prospecto...",
    "Detectando triggers de compra activos...",
    "Mapeando influenciadores internos del deal...",
    "Validando hipótesis de fricción técnica...",
    "Construyendo narrativa de valor diferencial...",
    "Procesando contexto macroeconómico regional...",
    "Analizando tasas de interés y su impacto en el sector...",
    "Evaluando impacto de open banking en el target...",
    "Verificando roadmap público de producto...",
    "Detectando brechas entre capacidad actual y ambición estratégica...",
    "Sintetizando inteligencia en dossier ejecutivo...",
    "Aplicando filtro de sesgo institucional...",
    "Corriendo simulación de escenario de cierre...",
    "Finalizando análisis Schwerpunkt...",
    "Compilando fuentes y trazabilidad del análisis..."
  ];

  let msgInterval = null;
  let msgIndex = 0;

  function startMessages() {
    stopMessages();
    msgIndex = 0;
    const el = document.getElementById('loading-msg');
    el.textContent = LOADING_MESSAGES[0];

    msgInterval = setInterval(() => {
      el.classList.add('fade');
      setTimeout(() => {
        msgIndex = (msgIndex + 1) % LOADING_MESSAGES.length;
        el.textContent = LOADING_MESSAGES[msgIndex];
        el.classList.remove('fade');
      }, 350);
    }, 3200);
  }

  function stopMessages() {
    if (msgInterval) { clearInterval(msgInterval); msgInterval = null; }
  }

  // ── URL DETECTION & TITLE EXTRACTION ──
  const COMPANY_INPUTS = [
    { inputId: 'empresa_vende', loaderId: 'loader-vende' },
    { inputId: 'empresa_compra', loaderId: 'loader-compra' }
  ];
  const URL_LIKE_PATTERN = /^(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:[/:?#].*)?$/i;
  const pendingUrlResolutions = new Map();

  function looksLikeUrl(value) {
    return URL_LIKE_PATTERN.test(value.trim());
  }

  function normalizeUrlCandidate(value) {
    const trimmed = value.trim();
    if (!looksLikeUrl(trimmed)) return null;

    try {
      const parsed = new URL(trimmed);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return parsed.href;
      }
      return null;
    } catch (_) {
      try {
        return new URL(`https://${trimmed}`).href;
      } catch (__){
        return null;
      }
    }
  }

  async function resolveCompanyInput(inputId, loaderId) {
    if (pendingUrlResolutions.has(inputId)) {
      return pendingUrlResolutions.get(inputId);
    }

    const input = document.getElementById(inputId);
    const loader = document.getElementById(loaderId);

    const task = (async () => {
      const rawValue = input.value.trim();
      input.classList.remove('url-error');

      if (!rawValue || !looksLikeUrl(rawValue)) {
        input.classList.remove('url-loading');
        loader.classList.remove('show');
        return { status: 'skipped' };
      }

      const normalizedUrl = normalizeUrlCandidate(rawValue);
      if (!normalizedUrl) {
        input.classList.remove('url-loading');
        loader.classList.remove('show');
        input.classList.add('url-error');
        return { status: 'invalid-url' };
      }

      loader.classList.add('show');
      input.classList.add('url-loading');

      try {
        const res = await fetch('/api/extract-title', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: normalizedUrl })
        });

        let data = null;
        try {
          data = await res.json();
        } catch (_) {
          data = null;
        }

        if (res.ok && data && data.success && data.title) {
          input.value = data.title;
          input.classList.remove('url-loading');
          loader.classList.remove('show');
          return { status: 'resolved' };
        }

        input.classList.remove('url-loading');
        loader.classList.remove('show');
        input.classList.add('url-error');
        return { status: 'invalid-url' };
      } catch (_) {
        input.classList.remove('url-loading');
        loader.classList.remove('show');
        input.classList.add('url-error');
        return { status: 'invalid-url' };
      }
    })();

    pendingUrlResolutions.set(inputId, task);
    try {
      return await task;
    } finally {
      pendingUrlResolutions.delete(inputId);
    }
  }

  async function resolveCompanyInputsBeforeRun() {
    const results = await Promise.all(
      COMPANY_INPUTS.map(({ inputId, loaderId }) => resolveCompanyInput(inputId, loaderId))
    );

    if (results.some((result) => result.status === 'invalid-url')) {
      throw new Error('Una URL parece inválida o no se pudo extraer el nombre de la empresa.');
    }
  }

  // ── MAIN ──
  async function runAnalysis() {
    const analyzeBtn = document.getElementById('analyze-btn');
    if (analyzeBtn.disabled) return;
    analyzeBtn.disabled = true;

    let empresa_vende = '';
    let empresa_compra = '';
    let concepto_venta = '';

    try {
      await resolveCompanyInputsBeforeRun();

      empresa_vende  = document.getElementById('empresa_vende').value.trim();
      empresa_compra = document.getElementById('empresa_compra').value.trim();
      concepto_venta = document.getElementById('concepto_venta').value.trim();

      if (!empresa_vende || !empresa_compra || !concepto_venta) {
        alert('Completa los tres campos para generar el dossier.');
        analyzeBtn.disabled = false;
        return;
      }
    } catch (err) {
      const errEl = document.getElementById('error');
      errEl.textContent = err instanceof Error ? `ERROR: ${err.message}` : `ERROR: ${String(err)}`;
      errEl.style.display = 'block';
      analyzeBtn.disabled = false;
      return;
    }

    // reset UI
    document.getElementById('error').style.display           = 'none';
    document.getElementById('result').style.display          = 'none';
    document.getElementById('web-context-box').style.display = 'none';
    document.getElementById('wc-body').innerHTML             = '';
    document.getElementById('wc-body').classList.remove('open');
    document.getElementById('wc-chevron').classList.remove('open');
    document.getElementById('wc-count').textContent          = '';
    document.getElementById('loading').style.display         = 'block';
    document.querySelector('.loading-label').textContent     = 'Inteligencia comercial';
    document.getElementById('loading-msg').textContent       = 'Iniciando secuencia de análisis...';
    analyzeBtn.disabled                                      = true;

    let snippetCount = 0;
    /** null = no llegó prepare_complete */
    let webContext = null;

    try {
      const res = await fetch('/api/prepare-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empresa_vende, empresa_compra, concepto_venta })
      });

      if (!res.ok) {
        const t = await res.text();
        throw new Error(`POST /api/prepare-stream HTTP ${res.status}: ${t}`);
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      prepareLoop: while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data: ')) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch { continue; }

          if (evt.type === 'snippet') {
            snippetCount++;
            if (snippetCount === 1) {
              document.getElementById('web-context-box').style.display = 'block';
            }
            const div = document.createElement('div');
            div.className = 'wc-snippet';
            div.innerHTML = `<a href="${escHtml(evt.url)}" target="_blank" rel="noopener">${escHtml(evt.title)}</a><span class="wc-body-text">${escHtml(evt.body)}</span>`;
            document.getElementById('wc-body').appendChild(div);
            document.getElementById('wc-count').textContent = `${snippetCount} fuentes`;
            document.getElementById('loading-msg').textContent = `Recopilando fuentes… (${snippetCount})`;

          } else if (evt.type === 'research_done') {
            document.getElementById('loading-msg').textContent = 'Obteniendo contenido web...';

          } else if (evt.type === 'fetch_started') {
            document.getElementById('loading-msg').textContent = `Obteniendo contenido web... (0/${evt.total})`;

          } else if (evt.type === 'fetch_progress') {
            document.getElementById('loading-msg').textContent = `Obteniendo contenido web... (${evt.done}/${evt.total})`;

          } else if (evt.type === 'fetch_done') {
            document.querySelector('.loading-label').textContent = 'Generando análisis';
            startMessages();

          } else if (evt.type === 'prepare_complete') {
            webContext = evt.web_context ?? '';
            break prepareLoop;
          }
        }
      }

      if (webContext === null) {
        throw new Error('El stream /api/prepare-stream terminó sin evento prepare_complete');
      }

      const genRes = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          empresa_vende,
          empresa_compra,
          concepto_venta,
          web_context: webContext
        })
      });
      const genRaw = await genRes.text();
      if (!genRes.ok) {
        let detail = genRaw;
        try {
          const j = JSON.parse(genRaw);
          if (typeof j.detail === 'string') detail = j.detail;
          else if (j.detail !== undefined) detail = JSON.stringify(j.detail);
        } catch (_) { /* usar genRaw */ }
        throw new Error(`POST /api/generate HTTP ${genRes.status}: ${detail}`);
      }
      let genJson;
      try {
        genJson = JSON.parse(genRaw);
      } catch (_) {
        throw new Error(`POST /api/generate: respuesta no JSON (HTTP ${genRes.status}) — ${genRaw.slice(0, 1200)}`);
      }
      if (typeof genJson.markdown !== 'string') {
        throw new Error(`POST /api/generate: falta markdown string en JSON — ${genRaw.slice(0, 1200)}`);
      }
      document.getElementById('result-content').innerHTML = marked.parse(genJson.markdown);
      document.getElementById('result').style.display = 'block';

    } catch (err) {
      const errEl = document.getElementById('error');
      errEl.textContent = err instanceof Error ? `ERROR: ${err.message}` : `ERROR: ${String(err)}`;
      errEl.style.display = 'block';
    } finally {
      stopMessages();
      document.getElementById('loading').style.display = 'none';
      analyzeBtn.disabled = false;
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── WEB CONTEXT toggle ──
  function toggleWebContext() {
    document.getElementById('wc-body').classList.toggle('open');
    document.getElementById('wc-chevron').classList.toggle('open');
  }

  // ── COPY & DOWNLOAD ––
  async function copyResult() {
    const content = document.getElementById('result-content').innerText;
    await navigator.clipboard.writeText(content);
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '[ ✓ copiado ]';
    setTimeout(() => { btn.textContent = '[ copiar markdown ]'; }, 2000);
  }

  function downloadMarkdown() {
    const content = document.getElementById('result-content').innerText;
    const blob = new Blob([content], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dossier-${new Date().toISOString().split('T')[0]}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  COMPANY_INPUTS.forEach(({ inputId, loaderId }) => {
    document.getElementById(inputId).addEventListener('blur', () => {
      resolveCompanyInput(inputId, loaderId);
    });
  });

  // ── ENTER KEY ──
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;

    const active = document.activeElement;
    const isInputField = active && (
      active.id === 'empresa_vende' ||
      active.id === 'empresa_compra' ||
      active.id === 'concepto_venta'
    );

    if (!isInputField) return;

    const analyzeBtn = document.getElementById('analyze-btn');
    if (analyzeBtn.disabled) return;

    e.preventDefault();
    analyzeBtn.click();
  });
</script>
