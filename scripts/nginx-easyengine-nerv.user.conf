# EasyEngine: /var/lib/docker/volumes/nervequalitechxyz_config_nginx/_data/custom/user.conf
# Rutas API (FastAPI) antes del catch-all para Next.js.
# Tras editar: docker exec nervequalitechxyz-nginx-1 nginx -s reload
# Nota: EE define location = /favicon.ico en main.conf (no duplicar). El favicon real se sirve en /icons/favicon.ico.

location /empresas {
  proxy_pass http://gtm_radar_sniper-backend-1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # NEXUS: RAG + 3× Gemini — suele >60s; sin esto nginx devuelve 504 Gateway Timeout
  proxy_connect_timeout 300s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
}

location = /health {
  proxy_pass http://gtm_radar_sniper-backend-1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /docs {
  proxy_pass http://gtm_radar_sniper-backend-1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /openapi.json {
  proxy_pass http://gtm_radar_sniper-backend-1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ / {
  proxy_pass http://gtm_radar_sniper-frontend-1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
